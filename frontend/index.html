<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absensi Ketik.com · PT Ketik Media Siber</title>
<link rel="icon" href="assets/img/ketik-icon.png" type="image/png">
<script>
  document.documentElement.dataset.theme =
    localStorage.getItem('absensi-theme') || 'light';
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon-box" aria-hidden="true">
        <img src="assets/img/ketik-icon.png" alt="Logo Ketik.com">
      </span>
      <div style="min-width:0">
        <h1>Ketik.com</h1>
        <p class="muted small" id="side-org" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">PT Ketik Media Siber</p>
      </div>
    </div>
    <nav class="nav" id="nav-desktop" aria-label="Menu navigasi"></nav>
    <div class="sidebar-foot">
      <div class="user-chip">
        <span class="avatar" id="user-avatar">A</span>
        <div style="min-width:0">
          <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="user-name">—</div>
          <div class="muted small" id="user-role">—</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="btn btn-secondary btn-sm" id="theme-toggle" type="button" title="Ubah tampilan terang atau gelap">Mode Gelap</button>
        <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">Keluar</button>
      </div>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-org" id="top-org">Ketik.com · Absensi Karyawan</span>
        <span class="topbar-divider"></span>
        <span class="topbar-date tabular" id="top-clock">—</span>
      </div>
      <div class="topbar-right">
        <span class="schedule-pill tabular" id="top-schedule">
          <svg class="ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>Jam Kerja —</span>
        </span>
      </div>
    </header>
    <main class="main" id="view" aria-live="polite"></main>
  </div>
</div>

<nav class="tabbar" id="nav-mobile" aria-label="Menu utama"></nav>
<div class="toast-wrap" id="toasts" aria-live="assertive"></div>
<div id="modal-root"></div>

<script src="assets/vendor/jsQR.js"></script>
<script src="assets/vendor/qrcode.js"></script>
<script src="assets/vendor/jspdf.umd.min.js"></script>
<script src="assets/vendor/jspdf.plugin.autotable.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/scanner.js"></script>
<script src="assets/js/kmeans.js"></script>
<script src="assets/js/pdf.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
